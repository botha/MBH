name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/mbh-transformation-presentation-055f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site/team/cvs/people
          cp index.html _site/index.html
          cp gate.css auth.js _site/
          cp team/index.html _site/team/index.html
          cp team/cvs/*.pdf _site/team/cvs/
          cp team/cvs/people/*.pdf _site/team/cvs/people/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
